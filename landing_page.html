<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>خدمات الصيانة</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    direction: rtl;
    background: #f5f5f5;
    text-align: center;
}

/* الهيدر */
.header {
    background: #0d6efd;
    color: white;
    padding: 20px;
    font-size: 22px;
    font-weight: bold;
}

/* الكروت */
.card {
    background: white;
    margin: 15px;
    padding: 15px;
    border-radius: 12px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

.card img {
    width: 100%;
    border-radius: 10px;
}

.card p {
    font-size: 16px;
    margin-top: 10px;
}

/* زر الاتصال */
.call-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #28a745;
    color: white;
    font-size: 18px;
    padding: 15px 20px;
    border-radius: 50px;
    text-decoration: none;
    box-shadow: 0 0 10px rgba(0,0,0,0.3);
}

/* زر واتساب */
.whatsapp-btn {
    position: fixed;
    bottom: 20px;
    left: 20px;
    background: #25D366;
    width: 55px;
    height: 55px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    box-shadow: 0 0 10px rgba(0,0,0,0.3);
}

.whatsapp-btn img {
    width: 30px;
}
</style>

</head>

<body>

<div class="header">
خدمة صيانة منزلية سريعة
</div>

<div class="card">
    <img src="https://images.unsplash.com/photo-1581578731548-c64695cc6952" alt="غسالة">
    <p>نقوم بصيانة وإصلاح جميع أنواع غسالات الملابس والمجففات داخل أبوظبي</p>
</div>

<div class="card">
    <img src="https://images.unsplash.com/photo-1586201375761-83865001e31c" alt="بوتاجاز">
    <p>نقوم بصيانة وإصلاح جميع أنواع البوتاجازات والأفران الكهربائية والغاز</p>
</div>

<!-- زر الاتصال -->
<a href="tel:0500000000" class="call-btn">📞 اتصل الآن</a>

<!-- زر واتساب -->
<a href="https://wa.me/971500000000" class="whatsapp-btn">
    <img src="https://cdn-icons-png.flaticon.com/512/733/733585.png">
</a>

</body>
</html>
